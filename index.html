<div style="text-align: center; background: #f0f4f8; padding: 10px; border-radius: 15px;">
    <iframe 
        style="width: 100%; height: 750px; border: 3px solid #3498db; border-radius: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1);"
        srcdoc='
        <!DOCTYPE html>
        <html dir="rtl">
        <head>
            <meta charset="UTF-8">
            <style>
                body { font-family: sans-serif; background: #fff; padding: 20px; text-align: center; }
                .resize-card { max-width: 500px; margin: auto; padding: 25px; border: 1px solid #eee; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
                h2 { color: #3498db; margin-bottom: 20px; }
                .input-box { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #ddd; }
                .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
                input[type="number"], input[type="file"] { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
                label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; text-align: right; }
                .btn-go { background: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; transition: 0.3s; }
                .btn-go:hover { background: #2980b9; }
                #status { margin-top: 15px; color: #27ae60; font-weight: bold; display: none; }
                .preview-info { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
            </style>
        </head>
        <body>
            <div class="resize-card">
                <h2>📐 مهندس مقاسات الصور</h2>
                <p>حدد الطول والعرض الذي تريده بدقة:</p>

                <div class="input-box">
                    <label>1. اختر الصورة:</label>
                    <input type="file" id="imgFile" accept="image/*" onchange="showOriginal()">
                    <div id="origInfo" class="preview-info"></div>
                </div>

                <div class="input-box">
                    <label>2. حدد المقاسات الجديدة (بكسل):</label>
                    <div class="grid">
                        <div>
                            <label>العرض (Width):</label>
                            <input type="number" id="newW" placeholder="مثلاً: 400">
                        </div>
                        <div>
                            <label>الطول (Height):</label>
                            <input type="number" id="newH" placeholder="مثلاً: 700">
                        </div>
                    </div>
                </div>

                <button class="btn-go" onclick="resizeNow()">تغيير المقاس وتحميل الآن 📥</button>
                
                <p id="status">تمت المعالجة بنجاح! ✅</p>
            </div>

            <script>
                function showOriginal() {
                    const file = document.getElementById("imgFile").files[0];
                    if(file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const img = new Image();
                            img.onload = function() {
                                document.getElementById("origInfo").innerText = "المقاس الأصلي: " + img.width + " × " + img.height;
                                // وضع المقاس الأصلي في الخانات تلقائياً كبداية
                                document.getElementById("newW").value = img.width;
                                document.getElementById("newH").value = img.height;
                            };
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                }

                function resizeNow() {
                    const file = document.getElementById("imgFile").files[0];
                    const w = parseInt(document.getElementById("newW").value);
                    const h = parseInt(document.getElementById("newH").value);

                    if(!file || !w || !h) {
                        alert("يا صالح، تأكد من اختيار صورة وكتابة الطول والعرض!");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement("canvas");
                            const ctx = canvas.getContext("2d");

                            // تطبيق المقاسات التي كتبها المستخدم يدوياً
                            canvas.width = w;
                            canvas.height = h;

                            // رسم الصورة بالمقاس الجديد
                            ctx.drawImage(img, 0, 0, w, h);

                            // التحميل الفوري
                            const link = document.createElement("a");
                            link.href = canvas.toDataURL("image/png");
                            link.download = "resized_image_" + w + "x" + h + ".png";
                            link.click();

                            document.getElementById("status").style.display = "block";
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            </script>
        </body>
        </html>'>
    </iframe>
</div>
